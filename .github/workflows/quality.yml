name: Quality checks

on:
  pull_request:
    branches: [main, 'audit/**']
  push:
    branches: [main, "audit/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.11'

      - name: Install Gitleaks (MIT)
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan repository and Git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . --redact --verbose --exit-code 1
